<!-- ============================
     LOGIN PAGE
============================ -->
<div id="loginPage" class="login-container">

    <div class="login-box">
        <h1 class="login-title">Training Portal Login</h1>

        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="employee@company.com">

        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password">

        <button id="loginButton" class="login-btn">Login</button>

        <p id="loginError" class="login-error"></p>
    </div>
</div>

<style>
    /* LOGIN PAGE STYLES */
    .login-container {
        width: 100%;
        height: 100vh;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-box {
        background: white;
        padding: 30px;
        width: 350px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .login-title {
        text-align: center;
        margin-bottom: 20px;
    }

    .login-box label {
        font-weight: bold;
        margin-top: 10px;
        display: block;
    }

    .login-box input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        background: #0078d4;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    .login-btn:hover {
        background: #005fa3;
    }

    .login-error {
        color: red;
        text-align: center;
        margin-top: 10px;
    }
</style>

     ADMIN ACCOUNT CREATION PANEL

<div class="admin-section">

    <h2>Administrator Control Panel</h2>
    <p>Create and manage user accounts for the Training Portal.</p>

    <div class="create-user-box">
        <h3>Create New User</h3>

        <label>Email</label>
        <input type="email" id="newUserEmail" placeholder="employee@company.com">

        <label>Password</label>
        <input type="password" id="newUserPassword" placeholder="Enter password">

        <label>Role</label>
        <select id="newUserRole">
            <option>IT Account Executive / Outside Sales</option>
            <option>Managed Print Services (MPS) Specialist</option>
            <option>Strategic / Regional Account Manager</option>
            <option>Sales Enablement & Support</option>

            <option>Print and Image Service Technician</option>
            <option>IT / Network Engineer</option>
            <option>Field Service Technician</option>
            <option>Delivery & Cable Specialist</option>

            <option>Warehouse & Logistics Worker</option>
            <option>Leasing & Billing Administrative Specialist</option>
            <option>Administrative Assistant / Reception</option>

            <option>Administrator</option>
        </select>

        <button id="createUserButton" class="admin-btn">Create User</button>
        <p id="createUserMessage" class="admin-message"></p>
    </div>

    <hr>

    <div class="user-list-box">
        <h3>Existing Users</h3>
        <div id="userList"></div>
    </div>

</div>

    /* ADMIN PANEL STYLES */
    .admin-section {

    .delete-user-btn {
        margin-top: 10px;
        background: #d9534f;
        color: white;<script>
// ============================
// USER DATABASE + LOGIN LOGIC
// ============================

// LocalStorage keys
const USERS_KEY = 'trainingPortalUsers';
const SESSION_KEY = 'trainingPortalSession';

// Get elements
const loginPage = document.getElementById('loginPage');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginButton = document.getElementById('loginButton');
const loginError = document.getElementById('loginError');

const createUserButton = document.getElementById('createUserButton');
const newUserEmail = document.getElementById('newUserEmail');
const newUserPassword = document.getElementById('newUserPassword');
const newUserRole = document.getElementById('newUserRole');
const createUserMessage = document.getElementById('createUserMessage');
const userList = document.getElementById('userList');

// Your main app container (portal)
const appContainer = document.querySelector('.app'); // adjust if your main wrapper has a different class/id

// ============================
// Helper functions
// ============================

function getUsers() {
    const data = localStorage.getItem(USERS_KEY);
    return data ? JSON.parse(data) : [];
}

function saveUsers(users) {
    localStorage.setItem(USERS_KEY, JSON.stringify(users));
}

function getSession() {
    const data = localStorage.getItem(SESSION_KEY);
    return data ? JSON.parse(data) : null;
}

function saveSession(session) {
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
}

function clearSession() {
    localStorage.removeItem(SESSION_KEY);
}

// ============================
// Render user list in Admin Panel
// ============================

function renderUserList() {
    if (!userList) return;

    const users = getUsers();
    if (users.length === 0) {
        userList.innerHTML = '<p>No users created yet.</p>';
        return;
    }

    userList.innerHTML = '';
    users.forEach((user, index) => {
        const div = document.createElement('div');
        div.className = 'user-card';
        div.innerHTML = `
            <h4>${user.email}</h4>
            <p>Role: ${user.role}</p>
            <button class="delete-user-btn" data-index="${index}">Delete User</button>
        `;
        userList.appendChild(div);
    });

    // Attach delete handlers
    const deleteButtons = userList.querySelectorAll('.delete-user-btn');
    deleteButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const idx = parseInt(btn.getAttribute('data-index'), 10);
            deleteUser(idx);
        });
    });
}

function deleteUser(index) {
    const users = getUsers();
    users.splice(index, 1);
    saveUsers(users);
    renderUserList();
}

// ============================
// Create user (Admin Panel)
// ============================

if (createUserButton) {
    createUserButton.addEventListener('click', () => {
        const email = newUserEmail.value.trim();
        const password = newUserPassword.value.trim();
        const role = newUserRole.value;

        if (!email || !password) {
            createUserMessage.textContent = 'Email and password are required.';
            createUserMessage.style.color = 'red';
            return;
        }

        let users = getUsers();

        // Check if email already exists
        if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
            createUserMessage.textContent = 'A user with this email already exists.';
            createUserMessage.style.color = 'red';
            return;
        }

        const newUser = {
            email,
            password,
            role
        };

        users.push(newUser);
        saveUsers(users);

        createUserMessage.textContent = 'User created successfully.';
        createUserMessage.style.color = 'green';

        newUserEmail.value = '';
        newUserPassword.value = '';
        newUserRole.value = 'IT Account Executive / Outside Sales';

        renderUserList();
    });
}

// ============================
// Login logic
// ============================

if (loginButton) {
    loginButton.addEventListener('click', () => {
        const email = loginEmail.value.trim();
        const password = loginPassword.value.trim();

        if (!email || !password) {
            loginError.textContent = 'Please enter email and password.';
            return;
        }

        const users = getUsers();
        const user = users.find(
            u => u.email.toLowerCase() === email.toLowerCase() && u.password === password
        );

        if (!user) {
            loginError.textContent = 'Invalid email or password.';
            return;
        }

        // Save session
        saveSession({
            email: user.email,
            role: user.role
        });

        // Show portal, hide login
        if (loginPage) loginPage.style.display = 'none';
        if (appContainer) appContainer.style.display = 'block';

        // Apply role-based behavior
        applyRoleAccess(user.role);
    });
}

// ============================
// Session restore on page load
// ============================

window.addEventListener('load', () => {
    const session = getSession();

    if (session && appContainer && loginPage) {
        loginPage.style.display = 'none';
        appContainer.style.display = 'block';
        applyRoleAccess(session.role);
    } else {
        if (loginPage) loginPage.style.display = 'flex';
        if (appContainer) appContainer.style.display = 'none';
    }

    renderUserList();
});

// ============================
// Logout function (you can wire this to a button)
// ============================

function logout() {
    clearSession();
    if (loginPage) loginPage.style.display = 'flex';
    if (appContainer) appContainer.style.display = 'none';
}

// ============================
// Role-based access
// ============================

function applyRoleAccess(role) {
    // Example: hide Admin Panel unless role is "Administrator"
    const adminPanel = document.getElementById('adminPanel');
    if (adminPanel) {
        if (role === 'Administrator') {
            adminPanel.style.display = 'block';
        } else {
            adminPanel.style.display = 'none';
        }
    }

    // Here you can add more role-based logic:
    // - Show/hide certain training sections
    // - Customize dashboard text
    // - Restrict supervisor-only modules, etc.
}

</script>
