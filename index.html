<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Portal">

<style>

/* ============================
   GLOBAL STYLES
============================ */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

.app {
    display: flex;
    height: 100vh;
}

/* ============================
   SIDEBAR
============================ */
.sidebar {
    width: 260px;
    background: #1e1e1e;
    color: white;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.sidebar-title {
    font-size: 22px;
    margin-bottom: 20px;
}

.sidebar-menu {
    list-style: none;
    padding: 0;
}

.sidebar-menu li {
    padding: 12px;
    margin-bottom: 8px;
    background: #2b2b2b;
    cursor: pointer;
    border-radius: 6px;
    transition: 0.2s;
}

.sidebar-menu li:hover {
    background: #3a3a3a;
}

.dark-btn {
    margin-top: auto;
    padding: 10px;
    background: #444;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

/* ============================
   MAIN CONTENT
============================ */
.main {
    flex: 1;
    padding: 30px;
    overflow-y: auto;
}

.section {
    display: none;
}

.section.active {
    display: block;
}
/* ============================
   TRAINING CARDS
============================ */
.training-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
}

.training-card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.training-card h3 {
    margin-top: 0;
}

.start-btn {
    margin-top: 10px;
    padding: 10px;
    width: 100%;
    background: #0078ff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.start-btn:hover {
    background: #005fcc;
}

/* ============================
   CERTIFICATIONS
============================ */
.cert-list {
    list-style: none;
    padding: 0;
}

.cert-list li {
    background: white;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* ============================
   TRAINING PAGE
============================ */
#trainingPage {
    text-align: center;
}

#trainingTitle {
    font-size: 28px;
    margin-bottom: 20px;
}

.back-btn {
    padding: 10px 20px;
    background: #444;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.back-btn:hover {
    background: #333;
}

/* ============================
   DARK MODE
============================ */
.dark body {
    background: #121212;
    color: #eaeaea;
}

.dark .sidebar {
    background: #000;
}

.dark .sidebar-menu li {
    background: #222;
}

.dark .sidebar-menu li:hover {
    background: #333;
}

.dark .training-card {
    background: #1e1e1e;
    color: #eaeaea;
}

.dark .cert-list li {
    background: #1e1e1e;
    color: #eaeaea;
}

.dark .start-btn {
    background: #0099ff;
}

.dark .back-btn {
    background: #666;
}

</style>
</head>

<body>

<div class="app">

    <!-- ============================
         SIDEBAR
    ============================ -->
    <div class="sidebar">
        <h2 class="sidebar-title">Training Portal</h2>

        <ul class="sidebar-menu">
            <li data-section="dashboard">Dashboard</li>
            <li data-section="trainings">Trainings</li>
            <li data-section="california">California Mandatory Training</li>
            <li data-section="certifications">Certifications</li>
            <li data-section="paths">Learning Paths</li>
            <li data-section="admin">Admin Panel</li>
        </ul>

        <button id="darkModeToggle" class="dark-btn">Dark Mode</button>
    </div>

    <!-- ============================
         MAIN CONTENT
    ============================ -->
    <div class="main">

        <!-- ============================
             DASHBOARD
        ============================ -->
        <section id="dashboard" class="section active">
            <h1>Welcome to the Training Portal</h1>
            <p>Select a section from the sidebar to begin.</p>
        </section>
        <!-- ============================
             TRAININGS SECTION
        ============================ -->
        <section id="trainings" class="section">
            <h1>All Trainings</h1>
            <div class="training-grid" id="trainingList">
                <!-- JS will populate all trainings here -->
            </div>
        </section>

        <!-- ============================
             CALIFORNIA MANDATORY TRAINING
        ============================ -->
        <section id="california" class="section">
            <h1>California Mandatory Training</h1>
            <p>These links open the official California state training websites.</p>

            <div class="training-grid">

                <div class="training-card">
                    <h3>SB 1343 — Sexual Harassment (Employee)</h3>
                    <button class="start-btn" data-link="https://calcivilrights.ca.gov/shpt/" data-newtab="true">
                        Start Training
                    </button>
                </div>

                <div class="training-card">
                    <h3>SB 1343 — Sexual Harassment (Supervisor)</h3>
                    <button class="start-btn" data-link="https://calcivilrights.ca.gov/shpt/supervisors/" data-newtab="true">
                        Start Training
                    </button>
                </div>

                <div class="training-card">
                    <h3>SB 553 — Workplace Violence Prevention</h3>
                    <button class="start-btn" data-link="https://www.dir.ca.gov/dosh/Workplace-Violence-Prevention.html" data-newtab="true">
                        Start Training
                    </button>
                </div>

                <div class="training-card">
                    <h3>Hazard Communication (HazCom)</h3>
                    <button class="start-btn" data-link="https://www.dir.ca.gov/dosh/dosh_publications/hazcom.pdf" data-newtab="true">
                        Start Training
                    </button>
                </div>

                <div class="training-card">
                    <h3>HIPAA Privacy & Security</h3>
                    <button class="start-btn" data-link="https://www.hhs.gov/hipaa/for-professionals/training/index.html" data-newtab="true">
                        Start Training
                    </button>
                </div>

            </div>
        </section>

        <!-- ============================
             CERTIFICATIONS SECTION
        ============================ -->
        <section id="certifications" class="section">
            <h1>Certifications</h1>
            <p>All employees are required to complete the following certifications:</p>

            <ul class="cert-list">
                <li>SB 1343 — Sexual Harassment (Employee)</li>
                <li>SB 1343 — Sexual Harassment (Supervisor — Admin Only)</li>
                <li>SB 553 — Workplace Violence Prevention</li>
                <li>Hazard Communication (HazCom)</li>
                <li>HIPAA Privacy & Security</li>
            </ul>
        </section>

        <!-- ============================
             LEARNING PATHS SECTION
        ============================ -->
        <section id="paths" class="section">
            <h1>Learning Paths</h1>
            <p>Structured training paths will be added soon.</p>
        </section>

        <!-- ============================
             ADMIN PANEL
        ============================ -->
        <section id="admin" class="section">
            <h1>Admin Panel</h1>
            <p>Admin tools will be added here.</p>
        </section>

        <!-- ============================
             INTERNAL TRAINING PLACEHOLDER PAGE
        ============================ -->
        <section id="trainingPage" class="section">
            <h1 id="trainingTitle"></h1>
            <p>Training content coming soon.</p>
            <button id="backToTrainings" class="back-btn">Back to Trainings</button>
        </section>

    </div> <!-- end main -->
</div> <!-- end app -->

<!-- ============================
     JAVASCRIPT
============================ -->
<script>

// ============================
// SECTION SWITCHING
// ============================
const sections = document.querySelectorAll(".section");
const menuItems = document.querySelectorAll(".sidebar-menu li");

menuItems.forEach(item => {
    item.addEventListener("click", () => {
        const target = item.getAttribute("data-section");

        sections.forEach(sec => sec.classList.remove("active"));
        document.getElementById(target).classList.add("active");
    });
});

// ============================
// DARK MODE TOGGLE
// ============================
document.getElementById("darkModeToggle").addEventListener("click", () => {
    document.body.classList.toggle("dark");
});

// ============================
// INTERNAL TRAININGS LIST
// ============================
const internalTrainings = [
    "Printer Setup",
    "Network Performance",
    "VoIP Basics",
    "CRM Tools",
    "Archiving Software",
    "Troubleshooting Essentials",
    "Leadership Essentials",
    "Customer Service Excellence",
    "Warehouse Operations",
    "Shredding Workflow",
    "Office Technology Overview",
    "Remote Work Tools",
    "Cybersecurity Basics",
    "Data Entry Accuracy",
    "Document Handling Procedures"
];

// ============================
// POPULATE TRAININGS SECTION
// ============================
const trainingList = document.getElementById("trainingList");

internalTrainings.forEach(name => {
    const card = document.createElement("div");
    card.classList.add("training-card");

    card.innerHTML = `
        <h3>${name}</h3>
        <button class="start-btn" data-internal="${name}">
            Start Training
        </button>
    `;

    trainingList.appendChild(card);
});

// ============================
// START TRAINING BUTTON LOGIC
// ============================
document.addEventListener("click", (e) => {
    if (e.target.classList.contains("start-btn")) {

        // External compliance training (opens in new tab)
        const link = e.target.getAttribute("data-link");
        const newTab = e.target.getAttribute("data-newtab");

        if (link) {
            if (newTab === "true") {
                window.open(link, "_blank");
            } else {
                window.location.href = link;
            }
            return;
        }

        // Internal training (placeholder page)
        const internalName = e.target.getAttribute("data-internal");
        if (internalName) {
            document.getElementById("trainingTitle").innerText = internalName;

            sections.forEach(sec => sec.classList.remove("active"));
            document.getElementById("trainingPage").classList.add("active");
        }
    }
});

// ============================
// BACK TO TRAININGS
// ============================
document.getElementById("backToTrainings").addEventListener("click", () => {
    sections.forEach(sec => sec.classList.remove("active"));
    document.getElementById("trainings").classList.add("active");
});

// ============================
// ADMIN PANEL LOGIC
// ============================
const isAdmin = true;

if (!isAdmin) {
    const supervisorCard = document.querySelector(
        'button[data-link="https://calcivilrights.ca.gov/shpt/supervisors/"]'
    ).parentElement;

    supervisorCard.style.display = "none";
}

</script>
</body>
</html>
